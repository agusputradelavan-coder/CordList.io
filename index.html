<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d0c0b"><meta name="description" content="CordList — cari chord gitar lagu Indonesia."><title>CordList — Chord Gitar Indonesia</title><style>
:root{color-scheme:dark;--bg:#0d0c0b;--panel:#151310;--panel2:#1d1916;--text:#f7f1eb;--muted:#aaa19a;--line:#37312c;--orange:#ff8a25;--soft:#ffb36a}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 82% -5%,rgba(255,138,37,.09),transparent 25rem),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55}button,input{font:inherit}.topbar{position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line);background:rgba(13,12,11,.94);backdrop-filter:blur(14px)}.nav{width:min(100% - 38px,760px);height:88px;margin:auto;display:flex;align-items:center}.brand{color:var(--text);font-size:1.65rem;font-weight:900;letter-spacing:-.065em;text-decoration:none}.brand span{color:var(--orange)}.search-button{width:58px;height:58px;margin-left:auto;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:#151311;color:var(--text);font-size:1.45rem;cursor:pointer}.search-button:hover{border-color:var(--orange)}main{width:min(100% - 38px,760px);margin:auto}.intro{padding:45px 0 28px}.eyebrow{margin:0 0 8px;color:var(--orange);font-size:.76rem;font-weight:850;letter-spacing:.16em}.intro h1{margin:0;font-size:clamp(2.05rem,9vw,3.7rem);line-height:1.05;letter-spacing:-.055em}.intro p:last-of-type{margin:14px 0 0;color:var(--muted)}.search-panel{max-height:0;overflow:hidden;opacity:0;transition:.24s ease}.search-panel.open{max-height:100px;opacity:1}.search-box{margin:0 0 28px;padding:0 16px;display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.search-box:focus-within{border-color:var(--orange)}.search-box span{color:var(--orange);font-size:1.35rem}.search-box input{width:100%;padding:15px 0;border:0;outline:0;background:transparent;color:var(--text)}.catalog{margin-bottom:78px;padding:22px 20px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#171411,#100f0e)}.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 12px 13px}.section-head h2{margin:0;font-size:1.35rem}.section-head span{color:var(--muted);font-size:.83rem}.song-list{display:grid}.song{padding:16px 12px;display:grid;grid-template-columns:44px 1fr 22px;gap:13px;align-items:center;border-bottom:1px solid var(--line);color:var(--text);text-decoration:none}.song:last-child{border-bottom:0}.song:hover{color:var(--soft)}.number{width:42px;height:42px;display:grid;place-items:center;border-radius:9px;background:var(--panel2);color:var(--orange);font-size:.85rem;font-weight:900}.song strong,.song small{display:block}.song small{margin-top:2px;color:var(--muted);font-size:.82rem}.arrow{color:var(--orange);font-weight:900}.empty{padding:30px 10px;color:var(--muted);text-align:center}footer{border-top:1px solid var(--line)}.footer-inner{width:min(100% - 38px,760px);margin:auto;padding:28px 0 52px;color:var(--muted);font-size:.84rem}@media(min-width:700px){.catalog{padding:27px 32px}.intro{padding-top:62px}.nav{height:96px}}
</style></head><body><header class="topbar"><nav class="nav" aria-label="Navigasi utama"><a class="brand" href="/CordList.io/">Cord<span>List</span></a><button class="search-button" id="toggle-search" type="button" aria-label="Buka pencarian">⌕</button></nav></header><main><section class="intro"><p class="eyebrow">CHORD GITAR INDONESIA</p><h1>Temukan lagu yang ingin dimainkan.</h1><p>Cari judul atau penyanyi, kemudian buka halaman chord-nya.</p></section><div class="search-panel" id="search-panel"><label class="search-box"><span>⌕</span><input id="search" type="search" placeholder="Cari lagu atau penyanyi…" autocomplete="off"></label></div><section class="catalog"><div class="section-head"><h2>Daftar lagu</h2><span id="count"></span></div><div class="song-list" id="results"></div><p class="empty" id="empty" hidden>Lagu tidak ditemukan.</p></section></main><footer><div class="footer-inner">© 2026 CordList · Chord mudah dibaca, nyaman dimainkan.</div></footer><script>
const BASE='/CordList.io/';const songs=[['peterpan/menunggumu','Menunggumu','Peterpan feat. Chrisye','Am'],['peterpan/mungkin-nanti','Mungkin Nanti','Peterpan','C'],['noah/separuh-aku','Separuh Aku','NOAH','Bm'],['naff/akhirnya-ku-menemukanmu','Akhirnya Ku Menemukanmu','Naff','C'],['ungu/demi-waktu','Demi Waktu','Ungu','Am'],['dewa-19/kangen','Kangen','Dewa 19','D']];const panel=document.querySelector('#search-panel'),input=document.querySelector('#search'),results=document.querySelector('#results'),count=document.querySelector('#count'),empty=document.querySelector('#empty');function draw(){const q=input.value.trim().toLowerCase();const found=songs.filter(s=>(s[1]+' '+s[2]).toLowerCase().includes(q));count.textContent=found.length+' lagu';empty.hidden=found.length>0;results.innerHTML=found.map((s,i)=>`<a class="song" href="${BASE+s[0]}/"><span class="number">${String(i+1).padStart(2,'0')}</span><span><strong>${s[2]} — ${s[1]}</strong><small>Nada dasar ${s[3]}</small></span><span class="arrow">›</span></a>`).join('')}document.querySelector('#toggle-search').addEventListener('click',()=>{panel.classList.toggle('open');if(panel.classList.contains('open'))setTimeout(()=>input.focus(),220)});input.addEventListener('input',draw);draw();
</script></body></html>
